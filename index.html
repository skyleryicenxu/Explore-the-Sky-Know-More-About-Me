<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyler — A Short Flight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#e9785d;
    --haze:255,236,226;
    --ink:#3e3366;
    --ink-soft:#6f6591;
    --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
    --sans:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:auto}
  body{
    font-family:var(--sans); color:#fff; overflow-x:hidden;
    background:linear-gradient(180deg,#4a5f9e 0%,#9a8fc4 45%,#ffc2a1 72%,#5f73a3 100%) fixed;
    -webkit-font-smoothing:antialiased;
  }
  canvas#scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  #scroll-space{position:relative;z-index:-1;width:1px}

  /* whiteout when flying through a cloud */
  #haze{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at 50% 50%, rgba(var(--haze),1) 0%, rgba(var(--haze),.96) 55%, rgba(var(--haze),.85) 100%);}
  #vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 55%, transparent 55%, rgba(20,16,50,.28) 100%);}

  /* top bar */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;justify-content:space-between;align-items:center;
    padding:22px clamp(18px,4vw,48px);pointer-events:none}
  .wordmark{font-size:12px;letter-spacing:.42em;font-weight:600;text-transform:uppercase;color:#fff;text-decoration:none;
    text-shadow:0 1px 12px rgba(20,20,60,.25);pointer-events:auto}
  .topbar nav{display:flex;gap:10px;pointer-events:auto}
  .pill{font:500 13px/1 var(--sans);color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.45);
    padding:10px 16px;border-radius:999px;cursor:pointer;text-decoration:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    transition:background .2s}
  .pill:hover{background:rgba(255,255,255,.3)}

  /* hero */
  #hero{position:fixed;left:0;right:0;top:15vh;z-index:3;text-align:center;padding:0 24px;pointer-events:none;
    text-shadow:0 1px 3px rgba(30,24,70,.35), 0 2px 28px rgba(40,30,90,.45)}
  #hero .kicker{font-size:13px;letter-spacing:.42em;text-transform:uppercase;font-weight:500;opacity:.92}
  #hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(76px,12vw,164px);line-height:.95;margin:14px 0 18px;letter-spacing:-.01em}
  #hero .tagline{font-family:var(--serif);font-style:italic;font-size:clamp(19px,2vw,24px);max-width:560px;margin:0 auto;opacity:.95}

  /* scroll hint */
  #scroll-hint{position:fixed;left:50%;bottom:7vh;transform:translateX(-50%);z-index:4;display:flex;flex-direction:column;align-items:center;gap:12px;
    font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:500;transition:opacity .5s;pointer-events:none;white-space:nowrap;
    text-shadow:0 1px 3px rgba(20,20,60,.45), 0 0 16px rgba(20,20,60,.35)}
  .mouse{width:24px;height:38px;border:1.5px solid rgba(255,255,255,.9);border-radius:14px;position:relative}
  .mouse::after{content:"";position:absolute;left:50%;top:7px;width:3px;height:8px;margin-left:-1.5px;border-radius:2px;background:#fff;animation:wheel 1.8s infinite}
  @keyframes wheel{0%{opacity:0;transform:translateY(-2px)}30%{opacity:1}100%{opacity:0;transform:translateY(12px)}}
  .swipe{display:none;width:2px;height:40px;background:linear-gradient(to top,rgba(255,255,255,0),#fff);position:relative;animation:swipe 1.8s infinite}
  @keyframes swipe{0%{transform:translateY(14px);opacity:0}40%{opacity:1}100%{transform:translateY(-10px);opacity:0}}

  /* boarding gate: music can only start after a tap, so the journey starts with one */
  html.locked, html.locked body{overflow:hidden;height:100%}
  .board{position:fixed;left:50%;bottom:8vh;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:12px;
    font:600 13px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:#3e3366;white-space:nowrap;
    background:rgba(255,252,247,.92);border:0;border-radius:999px;padding:17px 28px;cursor:pointer;
    box-shadow:0 14px 40px -12px rgba(40,25,90,.45);transition:opacity .6s, transform .6s;animation:boardPulse 2.4s ease-in-out infinite}
  .board .board-ico{font-size:16px;letter-spacing:0;color:var(--accent)}
  .board:hover{background:#fff}
  @keyframes boardPulse{50%{box-shadow:0 14px 40px -12px rgba(40,25,90,.45),0 0 0 10px rgba(255,255,255,.18)}}
  body.boarded .board{opacity:0;pointer-events:none;transform:translate(-50%,12px)}
  body:not(.boarded) #scroll-hint{opacity:0 !important}
  .sound{display:none}
  body.boarded .sound{display:inline-block}
  .sound.off{opacity:.7}
  #nudge{position:fixed;left:50%;bottom:28px;transform:translate(-50%,10px);z-index:4;opacity:0;transition:opacity .6s, transform .6s;
    font-size:11px;letter-spacing:.26em;text-transform:uppercase;pointer-events:none;display:flex;align-items:center;gap:8px;
    background:rgba(20,22,50,.22);padding:9px 14px;border-radius:999px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  #nudge.on{opacity:1;transform:translate(-50%,0)}
  #nudge .arrow{animation:bob 1.4s infinite}
  @keyframes bob{50%{transform:translateY(3px)}}

  /* floating labels over story clouds */
  .cloud-label{position:fixed;left:0;top:0;z-index:2;pointer-events:none;opacity:0;text-align:center;white-space:nowrap;
    transform:translate(-50%,-100%);text-shadow:0 1px 3px rgba(20,20,60,.55), 0 0 18px rgba(20,20,60,.4)}
  .cloud-label .num{display:block;font-family:var(--serif);font-size:30px;line-height:1}
  .cloud-label .q{display:block;font-size:11px;letter-spacing:.26em;text-transform:uppercase;font-weight:500;margin-top:6px}
  .cloud-label .stem{display:block;width:1px;height:26px;margin:8px auto 0;background:linear-gradient(#fff,rgba(255,255,255,0))}

  /* story card */
  #card{position:fixed;z-index:5;right:clamp(24px,7vw,120px);top:50%;width:min(440px,38vw);max-height:80vh;overflow:auto;
    transform:translateY(-50%);opacity:0;pointer-events:none;color:var(--ink);
    background:rgba(255,252,247,.88);border:1px solid rgba(255,255,255,.7);border-radius:20px;
    padding:34px 34px 30px;box-shadow:0 30px 80px -20px rgba(30,20,80,.35);
    backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2)}
  #card.on{pointer-events:auto}
  .c-kicker{font-size:11px;letter-spacing:.24em;text-transform:uppercase;font-weight:600;color:var(--accent);display:flex;gap:10px;align-items:center}
  .c-kicker .dot{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6}
  .c-title{font-family:var(--serif);font-weight:400;font-style:italic;font-size:40px;line-height:1.1;margin:0 0 18px;color:var(--ink)}
  .c-num{font-style:normal;color:var(--accent);margin-right:.4em}
  .c-story p{font-size:16.5px;line-height:1.7;color:var(--ink-soft);margin-bottom:4px}
  .c-take{margin-top:20px;padding:14px 0 2px 16px;border-left:2px solid var(--accent)}
  .c-take .lbl{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:600;color:var(--accent)}
  .c-take p{font-family:var(--serif);font-size:21px;line-height:1.3;color:var(--ink);margin-top:6px}
  .contact{margin-top:22px;display:flex;flex-direction:column;gap:10px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:rgba(29,35,64,.05);font-size:14.5px}
  .row .k{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-soft);font-weight:600}
  .row .v{color:var(--ink);word-break:break-all}
  .row a.v{text-decoration:none;border-bottom:1px solid rgba(29,35,64,.25)}
  .mini{font:600 12px/1 var(--sans);border:0;background:var(--ink);color:#fff;padding:8px 11px;border-radius:8px;cursor:pointer;flex-shrink:0}
  .btn-main{display:block;text-align:center;margin-top:6px;padding:15px;border-radius:12px;background:var(--accent);color:#fff;
    text-decoration:none;font-weight:600;font-size:15px;letter-spacing:.01em}
  .ph{font-style:italic;color:#8a7f9f;background:rgba(138,127,159,.08);outline:1px dashed rgba(138,127,159,.55);outline-offset:2px;border-radius:4px;padding:0 3px}

  /* flight log, bottom left */
  #flightlog{position:fixed;left:clamp(18px,4vw,48px);bottom:30px;z-index:4;font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:500;
    text-shadow:0 1px 10px rgba(20,20,60,.35);pointer-events:none;line-height:1.9}
  #flightlog .t{font-family:var(--serif);font-size:22px;letter-spacing:.04em;text-transform:none;display:block}

  /* progress rail, right side */
  #rail{position:fixed;right:clamp(16px,2.4vw,34px);top:50%;transform:translateY(-50%);z-index:6;height:min(46vh,340px);width:20px}
  #rail .track{position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(255,255,255,.35)}
  #rail .fill{position:absolute;left:50%;top:0;width:1px;background:#fff;height:0}
  #rail button{position:absolute;left:50%;width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;border:1.5px solid #fff;background:transparent;cursor:pointer;padding:0}
  #rail button.done{background:#fff}
  #rail button span{position:absolute;right:20px;top:50%;transform:translateY(-50%);font-size:10px;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;opacity:0;transition:opacity .2s;color:#fff;text-shadow:0 1px 3px rgba(20,20,60,.6), 0 0 14px rgba(20,20,60,.45)}
  #rail button:hover span, #rail button.active span{opacity:1}
  body.card-on #rail button span{opacity:0}
  #hero .ph{color:rgba(255,255,255,.88);background:rgba(255,255,255,.1);outline-color:rgba(255,255,255,.55)}
  #topbar-progress{display:none}

  /* list view ("skip the flight") */
  #list{position:fixed;inset:0;z-index:20;background:#faf7f2;color:var(--ink);overflow:auto;display:none}
  #list.open{display:block}
  #list .wrap{max-width:720px;margin:0 auto;padding:90px 28px 80px}
  #list .close{position:fixed;top:20px;right:22px;border:1px solid rgba(29,35,64,.2);background:#fff;color:var(--ink);border-radius:999px;padding:10px 16px;font:500 13px var(--sans);cursor:pointer}
  #list h1{font-family:var(--serif);font-weight:400;font-size:64px;line-height:1}
  #list .lt{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--ink-soft);margin:10px 0 50px}
  #list article{padding:34px 0;border-top:1px solid rgba(29,35,64,.12)}
  #list .c-title{font-size:32px;margin-top:10px}

  .no-webgl canvas#scene, .no-webgl #scroll-hint, .no-webgl #rail, .no-webgl #flightlog{display:none}

  /* ---------- phone layout ---------- */
  @media (max-width:760px){
    .topbar{padding:16px 16px}
    .pill{padding:9px 13px;font-size:12px}
    #hero{top:13vh}
    #card{left:12px;right:12px;width:auto;top:50%;top:50dvh;bottom:auto;transform:none;max-height:46vh;max-height:46dvh;padding:24px 22px 22px;border-radius:18px}
    .c-title{font-size:30px;margin:0 0 12px}
    .c-story p{font-size:15px;line-height:1.62}
    .c-take p{font-size:19px}
    #rail{display:none}
    #topbar-progress{display:block;position:fixed;top:0;left:0;height:2px;background:#fff;z-index:11;width:0}
    #flightlog{bottom:auto;top:62px;font-size:9.5px}
    #flightlog .t{font-size:18px}
    .mouse{display:none}.swipe{display:block}
    .cloud-label .num{font-size:24px}
    #list h1{font-size:48px}
  }
  @media (prefers-reduced-motion:reduce){ .mouse::after,.swipe,#nudge .arrow{animation:none} }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<div id="haze"></div>
<div id="vignette"></div>
<div id="topbar-progress"></div>
<header class="topbar"><span></span><nav><button class="pill sound" id="sound" aria-label="Turn music off">♪ On</button><button class="pill" id="skip">Skip the flight</button></nav></header>
<audio id="bgm" loop preload="auto"></audio>



<section id="hero">
  <div class="kicker" id="h-kicker"></div>
  <h1 id="h-name"></h1>
  <p class="tagline" id="h-tagline"></p>
</section>

<div id="scroll-hint"><div class="mouse"></div><div class="swipe"></div><span id="hint-text"></span></div>
<button id="board" class="board"><span class="board-ico">&#9992;&#xFE0E;</span><span id="board-text">Board the flight</span></button>
<div id="nudge"><span>Keep scrolling</span><span class="arrow">↓</span></div>
<div id="labels"></div>
<aside id="card" aria-live="polite"></aside>
<nav id="rail" aria-label="Flight progress"><div class="track"></div><div class="fill"></div></nav>

<div id="list" role="dialog" aria-label="All stories"><button class="close" id="list-close">Back to the flight</button><div class="wrap" id="list-wrap"></div></div>

<div id="scroll-space"></div>

<script src="content.js"></script>
<script type="module">
/* ====================================================================
   Skyler — a short flight. Scroll drives the plane along a path;
   each story cloud is a "chapter", the last cloud is the landing.
   All text lives in content.js.
   ==================================================================== */
const C = window.SITE_CONTENT || {};
const chapters = Array.isArray(C.chapters) ? C.chapters : [];
const landing = C.landing || {};
const $ = s => document.querySelector(s);
const isMobile = matchMedia('(max-width: 760px), (pointer: coarse)').matches;

/* ---------- helpers ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const txt = s => { const t = String(s ?? '').trim(); return /^\[[\s\S]*\]$/.test(t) ? `<span class="ph">${esc(t)}</span>` : esc(t); };
function keys(k, x) {
  if (x <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (x <= k[i][0]) { const [x0, y0] = k[i - 1], [x1, y1] = k[i]; return y0 + (y1 - y0) * (x - x0) / (x1 - x0); }
  return k[k.length - 1][1];
}

/* ---------- static text ---------- */
$('#h-kicker').innerHTML = txt(C.kicker);
$('#h-name').innerHTML = txt(C.name || 'Skyler');
$('#h-tagline').innerHTML = txt(C.tagline);
$('#hint-text').textContent = isMobile ? (C.scrollHintMobile || 'Swipe up to take off') : (C.scrollHint || 'Scroll to take off');
const LABEL_TXT = C.label || 'Fun fact';

function chapterHTML(c, i) {
  return `<h2 class="c-title"><span class="c-num">${pad(i + 1)}</span>${txt(c.title)}</h2>
    <div class="c-story"><p>${txt(c.text)}</p></div>`;
}
function landingHTML() {
  const L = landing;
  return `<h2 class="c-title">${txt(L.heading)}</h2>
    ${L.message ? `<div class="c-story"><p>${txt(L.message)}</p></div>` : ''}
    <div class="contact">
      <div class="row"><span class="k">Email</span><span class="v">${esc(L.email)}</span><button class="mini" data-copy="${esc(L.email)}">Copy</button></div>
    </div>`;
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = 'Copied'; }
  catch { const r = document.createRange(); r.selectNodeContents(b.previousElementSibling); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Selected'; }
  setTimeout(() => b.textContent = 'Copy', 1600);
});

/* ---------- list view ---------- */
$('#list-wrap').innerHTML = `<h1>${txt(C.name || 'Skyler')}</h1><p class="lt">${txt(C.tagline)}</p>` +
  chapters.map((c, i) => `<article><div class="c-kicker">${esc(LABEL_TXT)}</div>${chapterHTML(c, i)}</article>`).join('') + `<article><div class="c-kicker">${esc(landing.label || 'Landing')}</div>${landingHTML()}</article>`;
const list = $('#list');
const openList = () => { list.classList.add('open'); list.scrollTop = 0; };
const closeList = () => list.classList.remove('open');
$('#skip').onclick = openList; $('#list-close').onclick = closeList;
addEventListener('keydown', e => { if (e.key === 'Escape') closeList(); });

/* ---------- timeline (in screen-heights) ---------- */
const U_INTRO = 1.2, U_CH = 2.6, U_LAND = 2.4;
const segs = []; let u = U_INTRO;
chapters.forEach((c, i) => { segs.push({ type: 'chapter', i, a: u, b: u + U_CH, c }); u += U_CH; });
segs.push({ type: 'landing', i: chapters.length, a: u, b: u + U_LAND }); u += U_LAND;
const TOTAL = u;
segs.forEach(s => { s.pa = s.a / TOTAL; s.pb = s.b / TOTAL; });
const introEnd = U_INTRO / TOTAL;

/* distances along the flight path */
const GAP = 430, CLOUD = 46, EXIT = 82, D_INTRO = 140;
let dd = D_INTRO;
for (const s of segs) {
  s.start = dd; s.center = dd + GAP; s.exit = s.center + EXIT;
  if (s.type === 'chapter') { s.dk = [[0, s.start], [0.40, s.center], [0.50, s.exit], [0.90, s.exit + 45], [1, s.exit + 80]]; dd = s.exit + 80; }
  else { s.dk = [[0, s.start], [0.40, s.center], [0.50, s.exit], [1, s.exit + 330]]; dd = s.exit + 330; }
}
const D_END = dd, landSeg = segs[segs.length - 1];
const HAZE_CH = [[0, 0], [0.30, 0], [0.37, 1], [0.50, 1], [0.58, 0.1], [0.90, 0.1], [1, 0]];
const HAZE_LD = [[0, 0], [0.30, 0], [0.37, 1], [0.48, 1], [0.58, 0.06], [1, 0.06]];
const CARD_CH = [[0, 0], [0.5, 0], [0.58, 1], [0.88, 1], [0.95, 0], [1, 0]];
const CARD_LD = [[0, 0], [0.5, 0], [0.6, 1], [1, 1]];
const LABEL = [[0, 0], [0.04, 0], [0.12, 1], [0.27, 1], [0.33, 0], [1, 0]];

function segAt(p) { for (const s of segs) if (p < s.pb) return s; return segs[segs.length - 1]; }
function flightState(p) {
  if (p < introEnd) return { seg: null, s: p / introEnd, d: D_INTRO * smooth(p / introEnd) * 0.6 + D_INTRO * 0.4 * (p / introEnd) };
  const seg = segAt(p), s = clamp((p - seg.pa) / (seg.pb - seg.pa));
  return { seg, s, d: keys(seg.dk, s) };
}

/* ---------- rail ---------- */
const rail = $('#rail');
const railStops = [{ p: 0, name: 'Take-off' }, ...segs.map(s => ({
  p: s.type === 'landing' ? 1 : lerp(s.pa, s.pb, 0.72),
  name: s.type === 'landing' ? (landing.label || 'Landing') : `${pad(s.i + 1)} · ${LABEL_TXT}`
}))];
railStops.forEach(st => {
  const b = document.createElement('button'); b.style.top = (st.p * 100) + '%';
  b.innerHTML = `<span>${esc(st.name)}</span>`; b.setAttribute('aria-label', st.name);
  b.onclick = () => scrollTo({ top: st.p * maxScroll(), behavior: 'smooth' });
  rail.appendChild(b); st.el = b;
});

/* ---------- scroll ---------- */
let vh = innerHeight, lastW = innerWidth;
const space = $('#scroll-space');
const sizeSpace = () => { space.style.height = (TOTAL * vh + vh) + 'px'; };
sizeSpace();
const maxScroll = () => Math.max(1, document.documentElement.scrollHeight - innerHeight);
let targetP = 0, lastScroll = performance.now();
const readScroll = () => { targetP = clamp(scrollY / maxScroll()); lastScroll = performance.now(); };
addEventListener('scroll', readScroll, { passive: true });
readScroll();

/* ---------- boarding + music ---------- */
if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
scrollTo(0, 0); readScroll();
const root = document.documentElement, bgm = $('#bgm'), boardBtn = $('#board'), soundBtn = $('#sound');
root.classList.add('locked');
bgm.src = C.music || 'music.mp3';
$('#board-text').textContent = C.boardButton || 'Board the flight';
const MUSIC_VOL = typeof C.musicVolume === 'number' ? C.musicVolume : 0.6;
let musicOn = true, fadeId = 0;
function fadeTo(target, ms = 1500, then) {
  const id = ++fadeId, from = bgm.volume, t0 = performance.now();
  (function step(now) {
    if (id !== fadeId) return;
    const k = Math.min(1, Math.max(0, (now - t0) / ms)); bgm.volume = Math.min(1, Math.max(0, from + (target - from) * k));
    if (k < 1) requestAnimationFrame(step); else if (then) then();
  })(t0);
}
function startMusic() { bgm.volume = 0; const p = bgm.play(); if (p && p.catch) p.catch(() => {}); fadeTo(MUSIC_VOL); }
boardBtn.onclick = () => {
  document.body.classList.add('boarded'); root.classList.remove('locked');
  if (musicOn) startMusic();
};
soundBtn.onclick = () => {
  musicOn = !musicOn;
  soundBtn.textContent = musicOn ? '♪ On' : '♪ Off'; soundBtn.classList.toggle('off', !musicOn);
  soundBtn.setAttribute('aria-label', musicOn ? 'Turn music off' : 'Turn music on');
  if (musicOn) startMusic(); else fadeTo(0, 600, () => bgm.pause());
};
document.addEventListener('visibilitychange', () => {

const rtScale = isMobile ? 0.35 : 0.5;
function sizeRT() { const pr = renderer.getPixelRatio(); reflRT.setSize(Math.max(1, innerWidth * pr * rtScale | 0), Math.max(1, innerHeight * pr * rtScale | 0)); }

const rotM = new THREE.Matrix4(), NRM = new THREE.Vector3(0, 1, 0), plp = new THREE.Vector3(), cwp = new THREE.Vector3(), lap = new THREE.Vector3(), vv = new THREE.Vector3(), tv = new THREE.Vector3();
function renderReflection() {
  camera.updateMatrixWorld();

  plp.set(cwp.x, 0, cwp.z);
  rotM.extractRotation(camera.matrixWorld);
  lap.set(0, 0, -1).applyMatrix4(rotM).add(cwp);
  vv.subVectors(plp, cwp).reflect(NRM).negate().add(plp);
  tv.subVectors(plp, lap).reflect(NRM).negate().add(plp);
  reflCam.position.copy(vv);
  reflCam.up.set(0, 1, 0).applyMatrix4(rotM).reflect(NRM);
  reflCam.lookAt(tv);
  reflCam.updateMatrixWorld();
  reflCam.projectionMatrix.copy(camera.projectionMatrix);
  reflCam.projectionMatrixInverse.copy(camera.projectionMatrixInverse);
  texMat.set(0.5, 0, 0, 0.5, 0, 0.5, 0, 0.5, 0, 0, 0.5, 0.5, 0, 0, 0, 1).multiply(reflCam.projectionMatrix).multiply(reflCam.matrixWorldInverse);

/* ---- time-of-day palette: sunrise -> clear blue -> golden -> sunset ---- */
const PAL = [
  { p: 0.00, top: '#4a5f9e', hor: '#ffc4a3', sea: '#5d72a4', sun: '#ffd3a8', lit: '#ffe7dc', shade: '#a593c6', accent: '#e9785d', el: 3,  az: -32 },

  { p: 0.36, top: '#2d7de0', hor: '#bde0fc', sea: '#2a6ec0', sun: '#ffffff', lit: '#ffffff', shade: '#a6c3e7', accent: '#2f78d6', el: 48, az: -10 },
  { p: 0.58, top: '#3880d8', hor: '#d0e6f6', sea: '#2e6db6', sun: '#fff6e6', lit: '#fffaf3', shade: '#afc1e0', accent: '#3a7bcf', el: 44, az: 2 },
  { p: 0.76, top: '#5a4e9c', hor: '#ffbe7c', sea: '#58579a', sun: '#ffd08c', lit: '#ffe1ba', shade: '#9b80c0', accent: '#d9773f', el: 15, az: 8 },
  { p: 0.90, top: '#3a2a72', hor: '#ff9b5e', sea: '#48397c', sun: '#ffac6c', lit: '#ffc59c', shade: '#7c5ba9', accent: '#d8643f', el: 6,  az: -2 },
  { p: 1.00, top: '#2a1d5c', hor: '#ff8048', sea: '#3b2b66', sun: '#ff9157', lit: '#ffb58d', shade: '#6b4b9b', accent: '#d4573a', el: 1.6, az: -9 },
].map(k => ({ ...k, c: Object.fromEntries(['top', 'hor', 'sea', 'sun', 'lit', 'shade', 'accent'].map(n => [n, new THREE.Color(k[n])])) }));
const cA = new THREE.Color(), hazeC = new THREE.Color();
function applyPalette(p) {
  let i = 0; while (i < PAL.length - 2 && p > PAL[i + 1].p) i++;
  const A = PAL[i], B = PAL[i + 1], t = smooth((p - A.p) / (B.p - A.p));
  const mix = (n, target) => target.copy(A.c[n]).lerp(B.c[n], t);
  mix('top', U.top.value); mix('hor', U.horizon.value); mix('sea', U.sea.value);
  mix('sun', U.sunColor.value); mix('lit', U.lit.value); mix('shade', U.shade.value);
  const el = THREE.MathUtils.degToRad(lerp(A.el, B.el, t)), az = THREE.MathUtils.degToRad(lerp(A.az, B.az, t));
  U.sunDir.value.set(Math.sin(az) * Math.cos(el), Math.sin(el), -Math.cos(az) * Math.cos(el)).normalize();
  mix('accent', cA);
  hazeC.copy(U.lit.value).lerp(U.horizon.value, 0.25);
  const css = document.documentElement.style;
  css.setProperty('--accent', '#' + cA.getHexString());
  css.setProperty('--haze', `${hazeC.r * 255 | 0},${hazeC.g * 255 | 0},${hazeC.b * 255 | 0}`);
}

/* ---- loop ---- */
const P = new THREE.Vector3(), Pa = new THREE.Vector3(), Pb = new THREE.Vector3(), T = new THREE.Vector3(), UP = new THREE.Vector3(0, 1, 0);
const R = new THREE.Vector3(), camPos = new THREE.Vector3(), tgt = new THREE.Vector3(), heroT = new THREE.Vector3(), chaseT = new THREE.Vector3(), proj = new THREE.Vector3();
const hero = $('#hero'), hint = $('#scroll-hint'), nudge = $('#nudge'), haze = $('#haze'), fill = rail.querySelector('.fill'), topProg = $('#topbar-progress');
let curP = targetP, time = 0, last = performance.now();

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  const prev = curP;
  curP += (targetP - curP) * Math.min(1, dt * 3.2);
  if (Math.abs(targetP - curP) < 1e-5) curP = targetP;
  const vel = Math.abs(curP - prev) / Math.max(dt, 1e-4);
  U.time.value = time;
  applyPalette(curP);

  const phone = innerWidth <= 760;
  const st = flightState(curP), d = st.d;
  pathPos(d, P); pathPos(d + 2, Pb); pathPos(d - 2, Pa); T.subVectors(Pb, Pa).normalize();
  pathPos(d + 25, Pb); pathPos(d - 25, Pa);
  const xpp = (Pb.x - 2 * P.x + Pa.x) / 625;
  const roll = clamp(-xpp * 420, -0.65, 0.65);

  plane.position.copy(P); plane.position.y += Math.sin(time * 1.3) * 0.22;
  plane.lookAt(tmp.copy(plane.position).sub(T));
  plane.rotateZ(roll + Math.sin(time * 0.9) * 0.045);
  prop.rotation.z += dt * 21;
  /* captain: hands stay on the sticks; head bobs a little, ponytail flutters */
  captain.root.position.y = 0.02 + Math.sin(time * 1.7) * 0.02;
  captain.head.rotation.y = Math.sin(time * 0.7) * 0.14;
  captain.head.rotation.z = Math.sin(time * 0.9 + 1) * 0.05;
  captain.pony.forEach((seg, k) => {
    seg.rotation.x = [0.35, 0.45, 0.4, -0.2, -0.55][k] + Math.sin(time * 8 - k * 0.9) * 0.06;
    seg.rotation.y = (k === 0 ? 0.15 : 0.03) + Math.sin(time * 6 - k * 1.1) * (0.08 + k * 0.04);
  });

  /* camera: hero (front three-quarter) -> chase -> landing side shot */
  const heroK = smooth(curP / introEnd);
  let back = lerp(-12, 15, heroK), side = lerp(7.5, 2.4, heroK), up = lerp(0.6, 4.8, heroK);
  let lk = 0;
  if (st.seg && st.seg.type === 'landing') lk = smooth((st.s - 0.5) / 0.4);
  back = lerp(back, 13, lk); side = lerp(side, 3.5, lk); up = lerp(up, 2.0, lk);
  if (phone) { back *= 1.4; side *= 1.3; up *= 1.3; }
  R.crossVectors(T, UP).normalize();
  camPos.copy(P).addScaledVector(T, -back).addScaledVector(R, side).addScaledVector(UP, up);
  camera.position.copy(camPos);
  heroT.copy(P).addScaledVector(UP, 2.6);
  chaseT.copy(P).addScaledVector(T, 14).addScaledVector(UP, 1.8);
  tgt.copy(heroT).lerp(chaseT, heroK).addScaledVector(T, lk * 8);
  camera.lookAt(tgt);
  camera.rotateZ(roll * 0.22 * heroK);

  /* sky + sea follow the camera */
  sky.position.copy(camera.position);
  sea.position.set(Math.round(camera.position.x / 50) * 50, 0, Math.round(camera.position.z / 50) * 50);

  /* overlays */
  let hz = 0, cv = 0, active = -1;
  if (st.seg) {
    const L = st.seg.type === 'landing';
    hz = keys(L ? HAZE_LD : HAZE_CH, st.s);
    cv = keys(L ? CARD_LD : CARD_CH, st.s);
    if (cv > 0.001) active = st.seg.i;
  }
  haze.style.opacity = hz.toFixed(3);

  if (active !== cardFor && active >= 0) {
    card.innerHTML = active < chapters.length ? chapterHTML(chapters[active], active) : landingHTML();
    card.scrollTop = 0; cardFor = active;
  }
  card.style.opacity = cv.toFixed(3);
  const lift = (1 - cv) * 18;
  card.style.transform = phone ? `translateY(${lift}px)` : `translateY(calc(-50% + ${lift}px))`;
  card.classList.toggle('on', cv > 0.5);
  document.body.classList.toggle('card-on', cv > 0.05);

  /* shift the 3D framing so the plane sits beside (desktop) or above (phone) the card */
  const W = innerWidth, H = innerHeight;
  if (phone) camera.setViewOffset(W, H, 0, H * 0.32 * cv, W, H);
  else camera.setViewOffset(W, H, W * 0.15 * cv, 0, W, H);

  /* labels */
  segs.forEach((s, i) => {
    const lb = labels[i];
    const o = (st.seg === s) ? keys(LABEL, st.s) : 0;
    if (o < 0.01) { lb.el.style.opacity = 0; return; }
    proj.copy(lb.pos).project(camera);
    if (proj.z > 1) { lb.el.style.opacity = 0; return; }
    lb.el.style.opacity = o.toFixed(3);
    lb.el.style.left = ((proj.x * 0.5 + 0.5) * W) + 'px';
    lb.el.style.top = ((-proj.y * 0.5 + 0.5) * H) + 'px';
  });

  /* hero, hints */
  const hk = smooth(curP / (introEnd * 0.5));
  hero.style.opacity = (1 - hk).toFixed(3);
  hero.style.transform = `translateY(${-hk * 40}px)`;
  hint.style.opacity = targetP < 0.004 ? 1 : 0;
  const idle = now - lastScroll > 2600;
  nudge.classList.toggle('on', idle && curP > 0.01 && cv < 0.05 && targetP < 0.995 && !list.classList.contains('open'));

  /* speed lines */
  const sl = clamp((vel - 0.004) * 30) * 0.55 + hz * 0.15;
  lineMat.opacity = sl;
  lineData.forEach(m => { m.position.z += dt * (40 + vel * 3000); if (m.position.z > 6) m.position.z -= 86; });

  /* progress */
  fill.style.height = (curP * 100) + '%';
  topProg.style.width = (curP * 100) + '%';
  const activeStop = st.seg ? st.seg.i + 1 : 0;
  railStops.forEach((r, i) => {
    r.el.classList.toggle('done', curP >= r.p - 0.002);
    r.el.classList.toggle('active', i === activeStop);
  });

  renderReflection();
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
}
</script>
</body>
</html>
